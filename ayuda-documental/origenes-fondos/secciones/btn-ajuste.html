  <h1>Ajuste de saldo</h1>
  <p>Corrige el libro cuando el conteo físico no cuadra y no hay documento de venta/egreso. Queda auditado. No sustituye un traslado ni un egreso con proveedor.</p>

    <strong>Ejemplo.</strong> Faltaban $2.000 en efectivo por error de conteo del turno anterior.
