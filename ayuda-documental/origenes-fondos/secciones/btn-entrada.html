  <p>Suma dinero a un origen <strong>sin</strong> sacarlo de otro (apertura, hallazgo, aporte). Pide origen, valor, fecha y motivo opcional.</p>
  <div class="ej">
    <strong>Ejemplo.</strong> Base inicial del día en Caja Efectivo.
  </div>
  <p>No use Entrada para un retiro de cajero: eso llega por correo y luego <a href="btn-trasladar-fila.html">Trasladar</a>.</p>
