  <h1>A Cuenta del dueño</h1>
  <p>Clasifica el saldo como <strong>dinero personal / due-to</strong>, no como gasto del negocio. Equivale a arrastrar la fila a la tarjeta Cuenta del dueño.</p>
  <div class="ej">
    <strong>Ejemplo.</strong> Retiro del banco que se quedó el administrador, no se usó en la tienda.
  </div>
